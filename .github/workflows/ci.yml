name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request replaces its older run; pushes to a branch each finish, so every commit has a verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # gd + exif: progress photos are re-encoded and re-oriented on upload.
          extensions: dom, curl, libxml, mbstring, zip, pdo, pdo_sqlite, sqlite3, gd, exif, fileinfo
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Code style (Pint)
        if: matrix.php == '8.3'
        run: vendor/bin/pint --test

      - name: Migrate and seed a fresh database
        if: matrix.php == '8.3'
        run: php artisan migrate:fresh --seed --force

      - name: PHP tests
        run: php artisan test

  mysql:
    name: PHP tests on MySQL 8
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ironpulse_test
          MYSQL_USER: ip
          MYSQL_PASSWORD: ip
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: ironpulse_test
      DB_USERNAME: ip
      DB_PASSWORD: ip
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pdo, pdo_mysql, gd, exif, fileinfo
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # The API stores JSON columns, uses row locks and unique keys; run it on the engine production uses.
      - name: PHP tests
        run: php artisan test

  openapi:
    name: OpenAPI is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pdo, pdo_sqlite, sqlite3, gd, exif, fileinfo
          coverage: none

      - run: composer install --prefer-dist --no-interaction --no-progress

      - run: |
          cp .env.example .env
          php artisan key:generate

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pyyaml openapi-spec-validator

      - name: Regenerate and compare
        run: |
          python docs/mobile/openapi-src/generate.py
          git diff --exit-code docs/mobile/openapi.yaml
          python -m openapi_spec_validator docs/mobile/openapi.yaml

  flutter:
    name: Flutter app (analyze, test, APK, release bundle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - run: flutter --version

      - run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      # Includes the golden image tests, so the build also fails when the app's look changes unreviewed.
      - name: Unit, widget and golden tests
        run: flutter test

      # No server is baked in on purpose: the API address is a build-time choice (see mobile/README.md).
      - name: Debug APK
        run: flutter build apk --debug --dart-define=API_BASE_URL=https://api.example.invalid

      - uses: actions/upload-artifact@v4
        with:
          name: ironpulse-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # A release build runs R8 (code shrinking), which the debug build does not: plugins such as the camera and ML Kit are
      # where a release-only failure would show up. Without android/key.properties it is signed with the debug key, so it
      # proves the build and measures its size; it cannot be uploaded to Google Play (see docs/mobile/release.md).
      - name: Release bundle and per-ABI APKs (debug-signed)
        run: |
          flutter build appbundle --release --dart-define=API_BASE_URL=https://api.example.invalid
          flutter build apk --release --split-per-abi --dart-define=API_BASE_URL=https://api.example.invalid
          {
            echo '### Release build sizes (debug-signed, API address is a placeholder)'
            echo
            echo '| file | size |'
            echo '| --- | --- |'
            for f in build/app/outputs/bundle/release/app-release.aab build/app/outputs/flutter-apk/app-*-release.apk; do
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ironpulse-release-aab-debug-signed
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

  ios:
    # The iOS app has never been built anywhere else: no macOS and no Xcode in the environment this was written in. This
    # job compiles it (no code signing, so it cannot be installed or uploaded) and so checks the Podfile, the iOS 15.5
    # minimum the camera coach's ML Kit needs, and that every plugin builds for iOS. It does NOT run the app.
    name: iOS build (no code signing)
    # A recent Xcode is needed: camera_avfoundation 0.10 uses newer AVCaptureSession notification names than the Xcode of
    # macos-14 has (run 23), and device_info_plus 13.3 calls NSProcessInfo.isiOSAppOnVision, missing from Xcode 16.4 on
    # macos-15 (run 25). Apple also requires the current SDK for App Store uploads.
    runs-on: macos-26
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - run: flutter pub get

      - name: Xcode in use
        run: xcodebuild -version

      - name: Build iOS (release, no code signing)
        run: flutter build ios --release --no-codesign --dart-define=API_BASE_URL=https://api.example.invalid

      - name: Size of the app bundle
        run: |
          {
            echo '### iOS build (no code signing)'
            echo
            echo "Runner.app: $(du -sh build/ios/iphoneos/Runner.app | cut -f1) (not thinned or compressed; an App Store download is smaller)"
          } >> "$GITHUB_STEP_SUMMARY"

  app-api-contract:
    name: App against the real API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pdo, pdo_sqlite, sqlite3, gd, exif, fileinfo
          coverage: none

      - run: composer install --prefer-dist --no-interaction --no-progress

      - name: Start the backend
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate:fresh --seed --force
          # a tiny test-pattern clip for the bench press, so the app's video path meets a real signed media URL
          php artisan exercises:import-demos tests/fixtures/demo-clips
          nohup php artisan serve --host=127.0.0.1 --port=8123 > /tmp/serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8123/api/v1/app/config > /dev/null && break; sleep 1; done

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      # Signs up, onboards, browses, runs a whole workout and signs out through the app's own repositories, so a
      # change to the API that the app does not understand fails here and not on a member's phone.
      - name: Live contract test
        working-directory: mobile
        run: |
          flutter pub get
          flutter test test/live --dart-define=LIVE_API_URL=http://127.0.0.1:8123

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests (rule engine, rep counter, geometry, service worker, reminders)
        run: npm run test:js

      # The app's Dart posture engine is checked against what this engine does with the same poses.
      # If the engine or a rule changes, regenerate the fixture (node scripts/export-posture-parity.mjs) and commit it.
      - name: Mobile parity fixtures are up to date
        run: node scripts/export-posture-parity.mjs --check

      - name: Production build
        run: npm run build

  demo-clips:
    # Proves the clip pipeline end to end on a clean machine: the website's own 3D viewer, driven one frame at a time in
    # headless Chromium (software GL), encoded to H.264 by ffmpeg, then inspected. Two exercises only; the full set takes
    # about a minute per exercise with software rendering.
    name: Demo clip rendering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright, Chromium and ffmpeg
        run: |
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -hide_banner -version | head -1

      - name: Render two clips
        run: node scripts/render-exercise-demos.mjs --only=bodyweight-squat,push-up --views=angle,side --out=build-demo-clips

      - name: Inspect the clips
        run: |
          set -e
          test "$(jq '.clips | length' build-demo-clips/index.json)" = "4"
          for f in build-demo-clips/*.mp4; do
            read -r codec w h pix < <(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,pix_fmt -of csv=p=0:s=' ' "$f")
            echo "$f: $codec ${w}x${h} $pix, $(du -k "$f" | cut -f1) KB"
            test "$codec" = h264 && test "$w" = 640 && test "$h" = 640 && test "$pix" = yuv420p
          done
          # a figure was drawn: the poster is not a flat background (a flat JPEG compresses to a few KB)
          for f in build-demo-clips/*.jpg; do test "$(stat -c %s "$f")" -gt 12000; done

      - uses: actions/upload-artifact@v4
        with:
          name: demo-clips-sample
          path: build-demo-clips
          retention-days: 7
