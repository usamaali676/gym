name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # gd + exif: progress photos are re-encoded and re-oriented on upload.
          extensions: dom, curl, libxml, mbstring, zip, pdo, pdo_sqlite, sqlite3, gd, exif, fileinfo
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Code style (Pint)
        if: matrix.php == '8.3'
        run: vendor/bin/pint --test

      - name: Migrate and seed a fresh database
        if: matrix.php == '8.3'
        run: php artisan migrate:fresh --seed --force

      - name: PHP tests
        run: php artisan test

  mysql:
    name: PHP tests on MySQL 8
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ironpulse_test
          MYSQL_USER: ip
          MYSQL_PASSWORD: ip
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: ironpulse_test
      DB_USERNAME: ip
      DB_PASSWORD: ip
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pdo, pdo_mysql, gd, exif, fileinfo
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # The API stores JSON columns, uses row locks and unique keys; run it on the engine production uses.
      - name: PHP tests
        run: php artisan test

  openapi:
    name: OpenAPI is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pdo, pdo_sqlite, sqlite3, gd, exif, fileinfo
          coverage: none

      - run: composer install --prefer-dist --no-interaction --no-progress

      - run: |
          cp .env.example .env
          php artisan key:generate

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pyyaml openapi-spec-validator

      - name: Regenerate and compare
        run: |
          python docs/mobile/openapi-src/generate.py
          git diff --exit-code docs/mobile/openapi.yaml
          python -m openapi_spec_validator docs/mobile/openapi.yaml

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests (rule engine, rep counter, geometry, service worker, reminders)
        run: npm run test:js

      - name: Production build
        run: npm run build
