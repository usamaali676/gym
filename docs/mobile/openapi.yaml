    ContentManifest:
      type: object
      properties:
        cursor:
          type: integer
        collections:
          type: object
          additionalProperties:
            type: object
            properties:
              version:
                type: integer
              count:
                type: integer
        server_time:
          type: string
          format: date-time
    ContentSnapshot:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: true
        meta:
          type: object
          properties:
            collection:
              type: string
            page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer
            last_page:
              type: integer
    ContentChanges:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              change_id:
                type: integer
              collection:
                type: string
              id:
                type: integer
              action:
                type: string
                enum:
                - upsert
                - delete
              resource:
                type: object
                additionalProperties: true
        meta:
          type: object
          properties:
            cursor:
              type: integer
            has_more:
              type: boolean
            server_time:
              type: string
              format: date-time
      description: 'Apply in order. Repeat with after=meta.cursor while has_more is true. 410 cursor_expired means: download
        the collections again.'
    SyncBatch:
      type: object
      properties:
        operations:
          type: array
          items:
            type: object
            properties:
              op_id:
                type: string
                format: uuid
              type:
                type: string
                enum:
                - workout.set.log
                - workout.set.delete
                - workout.state.save
                - workout.finish
                - workout.abandon
                - food.log.create
                - food.log.delete
                - water.add
                - water.undo
                - habit.creatine
                - habit.sleep
                - measurement.save
                - posture.session.save
              payload:
                type: object
                additionalProperties: true
              client_created_at:
                type: string
                format: date-time
            required:
            - op_id
            - type
            - payload
          maxItems: 100
      required:
      - operations
    SyncResult:
      type: object
      properties:
        op_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - applied
          - duplicate
          - conflict
          - rejected
          - error
          - not_processed
        original_status:
          type: string
        server:
          type: object
          additionalProperties: true
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
        retryable:
          type: boolean
      required:
      - op_id
      - status
      description: 'applied: done. duplicate: this op_id was handled before. conflict: the server holds newer data (returned
        in `server`); resubmit with a fresh client_created_at to keep the local value. rejected: final, show the error. error/not_processed:
        retry the rest of the batch later.'
