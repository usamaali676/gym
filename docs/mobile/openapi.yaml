openapi: 3.1.0
info:
  title: IronPulse mobile API
  version: 1.0.0
  description: "REST API used by the IronPulse Android and iOS apps. The website keeps its own session-based routes; this\
    \ API is\nbearer-token only and is the contract between the Laravel backend and the Flutter app.\n\n**Conventions**\n\n\
    * Base path `/api/v1`. Every response is JSON. Success bodies are `{\"data\": ...}` (lists may add `meta` / `links`).\n\
    * Errors always look like `{\"error\": {\"code\", \"message\", \"details\", \"request_id\"}}`. `code` is stable and meant\
    \ for\n  program logic; `message` is human text. Quote `request_id` (also the `X-Request-Id` header) when reporting problems.\n\
    * Authentication: `Authorization: Bearer <token>` from `/auth/login`, `/auth/register` or `/auth/guest`. Tokens expire\n\
    \  (see `auth.token_ttl_days` in `/app/config`), are rotated by `/auth/refresh` and can be revoked at any time.\n  A `401`\
    \ on an authenticated call means the token is no longer valid: sign out.\n* Send `X-App-Platform: android|ios` and `X-App-Version:\
    \ 1.2.3` on every request. Builds below the minimum get `426\n  upgrade_required`; during maintenance every call except\
    \ `/app/config` gets `503 maintenance`.\n* Mutating requests may carry `Idempotency-Key: <8-80 chars>`. A retry with the\
    \ same key and body returns the first\n  response (`Idempotent-Replayed: true`); the same key with a different body is\
    \ `422 idempotency_key_reused`.\n* Membership: routes marked `x-entitlement` are refused with `403 entitlement_required`\
    \ (details name the missing\n  entitlement) when the member's plan does not include the feature. The server checks this\
    \ on every call; hiding a\n  button in the app is a courtesy, never the protection.\n* Everything about a member is private\
    \ to that member. Another member's record is answered `404`, never `403`.\n* Pagination: page-based (`page`, `per_page`,\
    \ max 100) for catalogues, cursor-based (`cursor`) for histories.\n* Sync: see the `Sync` tag. Read `/content/manifest`\
    \ first, download collections, then follow `/content/changes`.\n* Rate limits return `429 rate_limited` with a `Retry-After`\
    \ header.\n\n**Not covered by this document**: the website's session endpoints under `/api/...` (same-origin, CSRF protected)\
    \ and\nApple / Google store server notifications.\n"
servers:
- url: https://your-domain.example/api/v1
  description: Production (HTTPS only)
- url: http://localhost:8000/api/v1
  description: Local development
tags:
- name: Account
- name: App
- name: Auth
- name: Content
- name: Dashboard
- name: Habits
- name: Library
- name: Media
- name: Membership
- name: Notifications
- name: Nutrition
- name: Plan
- name: Posture coach
- name: Programs
- name: Progress
- name: Sync
- name: Workouts
security:
- bearerAuth: []
paths:
  /achievements:
    get:
      tags:
      - Progress
      summary: Badges with progress, XP and level (server-calculated)
      operationId: achievements
      x-requires-onboarding: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Achievements'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
  /announcements:
    get:
      tags:
      - Content
      summary: Published announcements for this member
      operationId: announcements
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Announcement'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
  /app/config:
    get:
      tags:
      - App
      summary: Version policy, maintenance, features and public settings (public)
      operationId: app_config
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/AppConfig'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/forgot-password:
    post:
      tags:
      - Auth
      summary: Email a password reset link (always 200)
      operationId: auth_forgot_password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required:
              - email
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/guest:
    post:
      tags:
      - Auth
      summary: Start a guest account
      operationId: auth_guest
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                device:
                  $ref: '#/components/schemas/DeviceInfo'
              required:
              - device
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/AuthResult'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/login:
    post:
      tags:
      - Auth
      summary: Sign in and receive a bearer token
      operationId: auth_login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                device:
                  $ref: '#/components/schemas/DeviceInfo'
              required:
              - email
              - password
              - device
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/AuthResult'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/logout:
    post:
      tags:
      - Auth
      summary: Revoke this install's token
      operationId: auth_logout
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/logout-all:
    post:
      tags:
      - Auth
      summary: Revoke every token of the account
      operationId: auth_logout_all
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/refresh:
    post:
      tags:
      - Auth
      summary: Rotate the token (old one stops working)
      operationId: auth_refresh
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    properties:
                      token:
                        $ref: '#/components/schemas/Token'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/register:
    post:
      tags:
      - Auth
      summary: Create an account
      operationId: auth_register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                device:
                  $ref: '#/components/schemas/DeviceInfo'
              required:
              - name
              - email
              - password
              - device
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/AuthResult'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/reset-password:
    post:
      tags:
      - Auth
      summary: Set a new password with a reset token
      operationId: auth_reset_password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
              required:
              - token
              - email
              - password
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/sessions:
    get:
      tags:
      - Auth
      summary: Signed-in installs of this account
      operationId: auth_sessions
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/sessions/{device}:
    delete:
      tags:
      - Auth
      summary: Sign another install out
      operationId: auth_sessions_destroy
      parameters:
      - name: device
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /banners:
    get:
      tags:
      - Content
      summary: Published banners (optional ?placement=)
      operationId: banners
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Banner'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
  /content/changes:
    get:
      tags:
      - Sync
      summary: Documents changed after a cursor
      operationId: content_changes
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentChanges'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
  /content/manifest:
    get:
      tags:
      - Sync
      summary: Sync cursor, per-collection versions and counts
      operationId: content_manifest
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/ContentManifest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
  /content/{collection}:
    get:
      tags:
      - Sync
      summary: Full paginated list of one collection
      operationId: content_snapshot
      parameters:
      - name: collection
        in: path
        required: true
        schema:
          type: string
          enum:
          - programs
          - exercises
          - foods
          - badges
          - membership_plans
          - announcements
          - banners
          - help
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentSnapshot'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /dashboard:
    get:
      tags:
      - Dashboard
      summary: Everything on the home screen in one call
      operationId: dashboard
      x-requires-onboarding: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Dashboard'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
  /exercises:
    get:
      tags:
      - Library
      summary: Search and filter the exercise library
      operationId: exercises_index
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExercisePage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
  /exercises/{exercise}:
    get:
      tags:
      - Library
      summary: One exercise (a teaser with locked=true if the plan lacks it)
      operationId: exercises_show
      parameters:
      - name: exercise
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Exercise'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /exercises/{exercise}/alternatives:
    get:
      tags:
      - Library
      summary: Same-muscle alternatives the member can do
      operationId: exercises_alternatives
      parameters:
      - name: exercise
        in: path
        required: true
        schema:
          type: string
      x-requires-onboarding: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Exercise'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /food-logs:
    post:
      tags:
      - Nutrition
      summary: Log a food; the server converts and stores the macros
      operationId: food_logs_store
      x-entitlement: nutrition
      x-requires-onboarding: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                food_id:
                  type: integer
                logged_on:
                  type: string
                  format: date
                meal:
                  type: string
                  enum:
                  - breakfast
                  - lunch
                  - snack
                  - dinner
                quantity:
                  type: number
                unit:
                  type: string
                  enum:
                  - grams
                  - serving
                serving_id:
                  type: integer
              required:
              - food_id
              - logged_on
              - meal
              - quantity
              - unit
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    properties:
                      log:
                        $ref: '#/components/schemas/FoodLog'
                      day:
                        $ref: '#/components/schemas/DayNutrition'
                      badges:
                        type: array
                        items:
                          $ref: '#/components/schemas/BadgeBrief'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/RateLimited'
  /food-logs/batch:
    post:
      tags:
      - Nutrition
      summary: Log several foods as one meal
      operationId: food_logs_batch
      x-entitlement: nutrition
      x-requires-onboarding: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                logged_on:
                  type: string
                  format: date
                meal:
                  type: string
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      food_id:
                        type: integer
                      grams:
                        type: number
                    required:
                    - food_id
                    - grams
              required:
              - logged_on
              - meal
              - items
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    properties:
                      logs:
                        type: array
                        items:
                          $ref: '#/components/schemas/FoodLog'
                      day:
                        $ref: '#/components/schemas/DayNutrition'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/RateLimited'
  /food-logs/copy:
    post:
      tags:
      - Nutrition
      summary: Copy a day (meals already present are left alone)
      operationId: food_logs_copy
      x-entitlement: nutrition
      x-requires-onboarding: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                from:
                  type: string
                  format: date
                to:
                  type: string
                  format: date
                meal:
                  type: string
              required:
              - from
              - to
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    properties:
                      copied:
                        type: integer
                      skipped:
                        type: array
                        items:
                          type: string
                      day:
                        $ref: '#/components/schemas/DayNutrition'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/RateLimited'
  /food-logs/{log}:
    patch:
      tags:
      - Nutrition
      summary: Change the amount or meal of an entry
      operationId: food_logs_update
      parameters:
      - name: log
        in: path
        required: true
        schema:
          type: integer
      x-entitlement: nutrition
      x-requires-onboarding: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity:
                  type: number
                unit:
                  type: string
                  enum:
                  - grams
                  - serving
                serving_id:
                  type: integer
                meal:
                  type: string
              required:
              - quantity
              - unit
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    properties:
                      log:
                        $ref: '#/components/schemas/FoodLog'
                      day:
                        $ref: '#/components/schemas/DayNutrition'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      tags:
      - Nutrition
      summary: Delete an entry
      operationId: food_logs_destroy
      parameters:
      - name: log
        in: path
        required: true
        schema:
          type: integer
      x-entitlement: nutrition
      x-requires-onboarding: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    properties:
                      day:
                        $ref: '#/components/schemas/DayNutrition'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /foods:
    post:
      tags:
      - Nutrition
      summary: Create a private custom food
      operationId: foods_store
      x-entitlement: nutrition
      x-requires-onboarding: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                brand:
                  type: string
                diet_type:
                  type: string
                kcal_100g:
                  type: number
                protein_100g:
                  type: number
                carbs_100g:
                  type: number
                fat_100g:
                  type: number
                fibre_100g:
                  type: number
                servings:
                  type: array
                  items:
                    type: object
                    properties:
                      label:
                        type: string
                      grams:
                        type: number
              required:
              - name
              - diet_type
              - kcal_100g
              - protein_100g
              - carbs_100g
              - fat_100g
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Food'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/RateLimited'
  /foods/favorites:
    get:
      tags:
      - Nutrition
      summary: Favourite foods
      operationId: foods_favorites
      x-entitlement: nutrition
      x-requires-onboarding: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Food'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /foods/recent:
    get:
      tags:
