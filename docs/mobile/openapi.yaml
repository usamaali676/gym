components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Sanctum personal access token (prefix `ipt_`)
  responses:
    Unauthenticated:
      description: Missing, expired or revoked token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: unauthenticated
              message: Missing, expired or revoked token.
              details: {}
              request_id: b2c1d1c8-...
    Forbidden:
      description: The member's plan does not include this (code entitlement_required, details.required_entitlement), the
        account is suspended (account_suspended) or a plan limit was reached (limit_reached).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: entitlement_required
              message: The member's plan does not include this (code entitlement_required, details.required_entitlement),
                the account is suspended (account_suspended) or a plan limit was reached (limit_reached).
              details: {}
              request_id: b2c1d1c8-...
    NotFound:
      description: No such record for this member.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: not_found
              message: No such record for this member.
              details: {}
              request_id: b2c1d1c8-...
    Invalid:
      description: Validation failed; details maps field names to messages.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: validation_failed
              message: Validation failed; details maps field names to messages.
              details: {}
              request_id: b2c1d1c8-...
    RateLimited:
      description: Too many requests; see Retry-After.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: rate_limited
              message: Too many requests; see Retry-After.
              details: {}
              request_id: b2c1d1c8-...
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
            request_id:
              type: string
          required:
          - code
          - message
          - request_id
      required:
      - error
    DeviceInfo:
      type: object
      properties:
        installation_id:
          type: string
          pattern: ^[A-Za-z0-9-]{16,64}$
          description: Generated by the app on first launch and kept in secure storage
        platform:
          type: string
          enum:
          - android
          - ios
        name:
          type: string
        app_version:
          type: string
        app_build:
          type: string
        os_version:
          type: string
        locale:
          type: string
        timezone:
          type: string
      required:
      - installation_id
      - platform
      - app_version
    Token:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum:
          - Bearer
        expires_at:
          type: string
          format: date-time
        refresh_after:
          type: string
          format: date-time
      required:
      - access_token
      - token_type
      - expires_at
      - refresh_after
    AuthResult:
      type: object
      properties:
        token:
          $ref: '#/components/schemas/Token'
        device_id:
          type: integer
        user:
          $ref: '#/components/schemas/User'
      required:
      - token
      - device_id
      - user
    Device:
      type: object
      properties:
        id:
          type: integer
        platform:
          type: string
        name:
          type: string
        app_version:
          type: string
        os_version:
          type: string
        last_seen_at:
          type: string
          format: date-time
        signed_in:
          type: boolean
        is_current:
          type: boolean
        push_enabled:
          type: boolean
    Profile:
      type: object
      properties:
        age:
          type: integer
        sex:
          type: string
        height_cm:
          type: number
        weight_kg:
          type: number
        target_weight_kg:
          type: number
        activity_level:
          type: string
        fitness_level:
          type: string
        goal:
          type: string
          enum:
          - cutting
          - bulking
          - maintenance
          - recomposition
        diet_preference:
          type: string
        equipment:
          type: array
          items:
            type: string
        training_days:
          type: array
          items:
            type: integer
        unit_system:
          type: string
          enum:
          - metric
          - imperial
        timezone:
          type: string
        plan_id:
          type: integer
        plan_started_on:
          type: string
          format: date
        public_name:
          type: string
    BodyProfile:
      type: object
      properties:
        name:
          type: string
        public_name:
          type: string
        age:
          type: integer
          minimum: 14
          maximum: 90
        sex:
          type: string
